name: BiocCheck Rapid Workflow

on:
  workflow_call:
    inputs:
      enable_pkgdown:
        description: 'Enable pkgdown site build and deployment'
        required: false
        type: boolean
        default: false
      enable_cyclocomp:
        description: 'Enable cyclomatic complexity analysis via cyclocomp'
        required: false
        type: boolean
        default: false
      enable_coverage_report:
        description: 'Compute test coverage with covr and save an HTML report as an artifact, without Codecov'
        required: false
        type: boolean
        default: false
      rcmdcheck_error_on:
        description: 'R CMD check failure policy: fail the job on this severity or worse (never, note, warning, error)'
        required: false
        type: string
        default: 'warning'
      bioccheck_error_on:
        description: 'BiocCheck failure policy: error fails the job on any BiocCheck ERROR; never only reports'
        required: false
        type: string
        default: 'error'
      bioc_version:
        description: 'Override Bioconductor version/container tag (e.g. devel, RELEASE_3_20). Auto-derived if empty.'
        required: false
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        description: 'Token for uploading coverage to Codecov'
        required: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.resolve.outputs.docker_tag }}
      is_release_branch: ${{ steps.resolve.outputs.is_release_branch }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
    steps:
      - name: Resolve Container Tag and Checkout Ref
        id: resolve
        run: |
          OVERRIDE_TAG="${{ inputs.bioc_version }}"

          if [ -n "$OVERRIDE_TAG" ]; then
            DOCKER_TAG="$OVERRIDE_TAG"
            REF_NAME="${GITHUB_REF_NAME}"
          else
            # For PRs, use the target base branch; for pushes, use the pushed branch.
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              REF_NAME="${{ github.base_ref }}"
            else
              REF_NAME="${GITHUB_REF_NAME}"
            fi

            # Derive the container tag from the branch name.
            # Valid bioconductor/bioconductor_docker tags: devel, RELEASE_X_Y
            if [[ "${REF_NAME}" =~ ^RELEASE_ ]]; then
              DOCKER_TAG="${REF_NAME}"
            elif [[ "${REF_NAME}" == "devel" || "${REF_NAME}" == "master" || "${REF_NAME}" == "main" ]]; then
              DOCKER_TAG="devel"
            else
              echo "::warning::Branch '${REF_NAME}' is not 'devel', 'master', 'main', or 'RELEASE_*'; defaulting to devel container."
              DOCKER_TAG="devel"
            fi
          fi

          if [[ "${REF_NAME}" =~ ^RELEASE_ ]]; then
            IS_RELEASE="true"
          else
            IS_RELEASE="false"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            CHECKOUT_REF="${{ github.event.pull_request.head.sha }}"
          else
            CHECKOUT_REF="${GITHUB_SHA}"
          fi

          {
            echo "docker_tag=${DOCKER_TAG}"
            echo "is_release_branch=${IS_RELEASE}"
            echo "checkout_ref=${CHECKOUT_REF}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved DOCKER_TAG=${DOCKER_TAG}, IS_RELEASE=${IS_RELEASE}, CHECKOUT_REF=${CHECKOUT_REF}"

  check:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:${{ needs.setup.outputs.docker_tag }}
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: 'true'
      GITHUB_PAT: ${{ github.token }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # pkgdown is built only on pushes to release branches, so it is installed only then.
      INSTALL_PKGDOWN: ${{ inputs.enable_pkgdown && github.event_name != 'pull_request' && needs.setup.outputs.is_release_branch == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}

      - name: Query R and System Dependencies
        id: get-deps
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest", BiocManager::repositories()))
          if (!requireNamespace("remotes", quietly = TRUE)) install.packages("remotes")
          deps <- remotes::dev_package_deps(".", dependencies = TRUE)
          saveRDS(deps, ".github/depends.Rds")
          writeLines(sprintf("R-%s.%i", R.version$major, floor(as.numeric(R.version$minor))), ".github/R-version")

      - name: Cache R Packages
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/R/site-library
          # The "-1-" segment is a manual cache version; bump it to discard all existing caches.
          # INSTALL_PKGDOWN is part of the key because a cache saved by a run without pkgdown is never re-saved.
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('.github/depends.Rds') }}-pkgdown-${{ env.INSTALL_PKGDOWN }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-

      - name: Install Package Dependencies
        env:
          ENABLE_CYCLOCOMP: ${{ inputs.enable_cyclocomp }}
          ENABLE_COVERAGE_REPORT: ${{ inputs.enable_coverage_report }}
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest", BiocManager::repositories()))
          remotes::install_local(".", dependencies = TRUE, Ncpus = parallel::detectCores())
          # Only install the tools for features that are used in this run.
          pkgs <- c("rcmdcheck", "BiocCheck")
          upload_codecov <- nzchar(Sys.getenv("CODECOV_TOKEN"))
          report_coverage <- Sys.getenv("ENABLE_COVERAGE_REPORT") == "true"
          if (upload_codecov || report_coverage) pkgs <- c(pkgs, "covr")
          # xml2 is used by covr::to_cobertura() and by testthat's JunitReporter.
          if (upload_codecov) pkgs <- c(pkgs, "xml2")
          if (report_coverage) pkgs <- c(pkgs, "DT", "htmltools")
          if (Sys.getenv("INSTALL_PKGDOWN") == "true") pkgs <- c(pkgs, "pkgdown")
          if (Sys.getenv("ENABLE_CYCLOCOMP") == "true") pkgs <- c(pkgs, "cyclocomp")
          BiocManager::install(pkgs, Ncpus = parallel::detectCores())

      # R CMD check runs tests/testthat.R in an `R --vanilla` subprocess that
      # reads no profile except the startup file R copies from
      # share/R/tests-startup.R, so that is where the JUnit reporter for
      # Codecov Test Analytics is set up. testthat's check reporter keeps
      # writing to testthat.Rout as before (ADR 0014).
      - name: Set Up JUnit Test Results for Codecov
        if: env.CODECOV_TOKEN != ''
        continue-on-error: true
        shell: bash
        run: |
          startup="$(Rscript -e 'cat(R.home("share"))')/R/tests-startup.R"
          cat >> "$startup" <<'EOF'

          # JunitReporter errors without xml2, which would fail the tests.
          if (nzchar(Sys.getenv("TESTTHAT_JUNIT_FILE")) && nzchar(system.file(package = "xml2"))) {
            setHook(packageEvent("testthat", "onLoad"), function(...) {
              options(testthat.default_check_reporter = testthat::MultiReporter$new(list(
                testthat::CheckReporter$new(),
                testthat::JunitReporter$new(file = Sys.getenv("TESTTHAT_JUNIT_FILE"))
              )))
            })
          }
          EOF

      - name: Run R CMD check
        id: rcmdcheck
        env:
          RCMDCHECK_ERROR_ON: ${{ inputs.rcmdcheck_error_on }}
        shell: Rscript {0}
        run: |
          # Read by the startup hook above. Set here, not from the github.workspace context,
          # which is the host path in container jobs; absolute because tests run in
          # check/<pkg>.Rcheck/tests.
          # Removing any junit.xml from the checkout means only this run's results are uploaded.
          if (nzchar(Sys.getenv("CODECOV_TOKEN"))) {
            junit_file <- file.path(getwd(), "junit.xml")
            unlink(junit_file)
            Sys.setenv(TESTTHAT_JUNIT_FILE = junit_file)
          }
          allowed <- c("never", "note", "warning", "error")
          error_on <- Sys.getenv("RCMDCHECK_ERROR_ON", unset = "warning")
          if (!error_on %in% allowed) stop("Invalid rcmdcheck_error_on value: '", error_on, "'. Must be one of: ", paste(allowed, collapse = ", "))
          res <- rcmdcheck::rcmdcheck(".", args = "--no-manual", error_on = error_on, check_dir = "check")
          print(res)

      - name: Run BiocCheck
        env:
          BIOCCHECK_ERROR_ON: ${{ inputs.bioccheck_error_on }}
        shell: Rscript {0}
        run: |
          allowed <- c("error", "never")
          error_on <- Sys.getenv("BIOCCHECK_ERROR_ON", unset = "error")
          if (!error_on %in% allowed) stop("Invalid bioccheck_error_on value: '", error_on, "'. Must be one of: ", paste(allowed, collapse = ", "))
          tarballs <- dir("check", pattern = "\\.tar\\.gz$", full.names = TRUE)
          if (length(tarballs) != 1) stop("Expected exactly one package tarball in check/, found ", length(tarballs))
          # BiocCheck exits non-zero only on ERRORs; WARNINGs and NOTEs never fail the job.
          BiocCheck::BiocCheck(
            tarballs,
            `quit-with-status` = identical(error_on, "error"), `no-check-bioc-help` = TRUE
          )

      # Coverage is computed once and used by whichever of the Codecov upload
      # (CODECOV_TOKEN set) and the HTML report (enable_coverage_report) is on.
      # Coverage problems never fail the check (ADR 0011).
      - name: Test Coverage
        id: coverage
        if: >-
          success()
          && needs.setup.outputs.is_release_branch == 'false'
          && (env.CODECOV_TOKEN != '' || inputs.enable_coverage_report == true)
        continue-on-error: true
        env:
          ENABLE_COVERAGE_REPORT: ${{ inputs.enable_coverage_report }}
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage()
          print(cov)
          if (nzchar(Sys.getenv("CODECOV_TOKEN"))) {
            covr::to_cobertura(cov, filename = "coverage.xml")
          }
          if (Sys.getenv("ENABLE_COVERAGE_REPORT") == "true") {
            covr::report(cov, file = "coverage-report/index.html", browse = FALSE)
            # Per-file percentages on the run's summary page.
            per_line <- covr::tally_coverage(cov, by = "line")
            files <- split(per_line$value > 0, per_line$filename)
            # Lowest coverage first, so the files that need tests are at the top.
            pct <- sort(vapply(files, function(x) 100 * mean(x), numeric(1)))
            total <- covr::percent_coverage(cov)
            if (length(pct) == 0L || is.nan(total)) {
              summary_md <- "### Test coverage: no lines of R code were measured"
            } else {
              summary_md <- c(
                sprintf("### Test coverage: %.1f%%", total),
                "",
                "| File | Coverage |",
                "|---|---|",
                sprintf("| `%s` | %.1f%% |", names(pct), pct),
                "",
                "The line-by-line report is in the `coverage-report` artifact."
              )
            }
            cat(summary_md, file = Sys.getenv("GITHUB_STEP_SUMMARY"), sep = "\n", append = TRUE)
          }

      - name: Upload Coverage Report
        if: steps.coverage.outcome == 'success' && inputs.enable_coverage_report == true
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: warn

      # The Codecov action verifies its uploader with gpg, which the
      # Bioconductor container doesn't include.
      - name: Install gpg for Codecov
        id: gpg
        if: >-
          !cancelled()
          && env.CODECOV_TOKEN != ''
          && (
            steps.coverage.outcome == 'success'
            || (steps.rcmdcheck.outcome != 'skipped' && hashFiles('junit.xml') != '')
          )
        continue-on-error: true
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          command -v gpg >/dev/null 2>&1 || {
            apt-get update -qq && apt-get install -y -qq --no-install-recommends gnupg
          }

      # The Codecov action, unlike covr::codecov(), accepts an organization's
      # global upload token as well as a repository token (ADR 0011).
      - name: Upload Coverage to Codecov
        if: steps.coverage.outcome == 'success' && steps.gpg.outcome == 'success'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          disable_telem: true
          fail_ci_if_error: false

      # Runs even when R CMD check failed, since failing tests are what
      # Test Analytics reports. Only testthat packages produce junit.xml.
      - name: Upload Test Results to Codecov
        if: >-
          !cancelled()
          && env.CODECOV_TOKEN != ''
          && steps.gpg.outcome == 'success'
          && steps.rcmdcheck.outcome != 'skipped'
          && hashFiles('junit.xml') != ''
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          disable_search: true
          disable_telem: true
          fail_ci_if_error: false

      - name: Run Cyclocomp
        if: inputs.enable_cyclocomp == true
        continue-on-error: true
        shell: Rscript {0}
        run: |
          pkg_name <- read.dcf("DESCRIPTION", fields = "Package")[1L, "Package"]
          result <- tryCatch(
            cyclocomp::cyclocomp_package(pkg_name),
            error = function(e) {
              message("cyclocomp failed: ", conditionMessage(e))
              NULL
            }
          )
          if (is.null(result)) {
            result <- data.frame(name = character(), cyclocomp = integer())
          }
          write.csv(result, "cyclocomp_results.csv", row.names = FALSE)
          message("cyclocomp: ", nrow(result), " functions analyzed")

      - name: Upload Cyclocomp Results
        if: always() && inputs.enable_cyclocomp == true
        uses: actions/upload-artifact@v7
        with:
          name: cyclocomp-results
          path: cyclocomp_results.csv
          if-no-files-found: warn

      - name: Build pkgdown Site
        if: success() && env.INSTALL_PKGDOWN == 'true'
        shell: Rscript {0}
        run: |
          pkgdown::build_site()

      - name: Upload pkgdown artifact
        if: success() && env.INSTALL_PKGDOWN == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs:
      - check
      - setup
    if: >-
      ${{
        inputs.enable_pkgdown
        && github.event_name != 'pull_request'
        && needs.setup.outputs.is_release_branch == 'true'
      }}
    # NOTE: The caller workflow must grant `pages: write` and `id-token: write` permissions when `enable_pkgdown` is enabled.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
