name: Canary Check

# Runs on a weekly schedule and on-demand to verify that bioccheck.yml
# executes correctly end-to-end against the Bioconductor container tag derived from the branch (main => devel).
# Uses rcmdcheck_error_on: "never" so expected R CMD check findings from this stub package
# (non-standard top-level files such as ci.yml and docs/) do not cause a false failure.
# bioccheck_error_on keeps its default so the fatal BiocCheck path is exercised.
# Enables cyclocomp so the conditional install and artifact upload are exercised.

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  canary:
    uses: ./.github/workflows/bioccheck.yml
    with:
      rcmdcheck_error_on: 'never'
      enable_cyclocomp: true
